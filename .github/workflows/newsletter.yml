name: AI Daily Newsletter

on:
  schedule:
    # 10:00 PM IST = 4:30 PM UTC
    - cron: "30 16 * * *"

  # Allows you to manually run the newsletter from GitHub
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # SHOW EXECUTION TIME
      # =====================================================

      - name: Show execution time
        run: |
          echo "========================================"
          echo "WORKFLOW EXECUTION TIME"
          echo "========================================"
          echo "UTC time:"
          date -u
          echo ""
          echo "IST time:"
          TZ=Asia/Kolkata date
          echo "========================================"

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # INSTALL UV
      # =====================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python
        run: uv python install 3.13

      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: uv sync

      # =====================================================
      # RUN NEWSLETTER
      # =====================================================

      - name: Run newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}

        run: |
          echo "========================================"
          echo "NEWSLETTER START TIME"
          echo "========================================"
          echo "UTC:"
          date -u
          echo ""
          echo "IST:"
          TZ=Asia/Kolkata date
          echo "========================================"

          uv run python daily_runner.py

          echo "========================================"
          echo "NEWSLETTER END TIME"
          echo "========================================"
          echo "UTC:"
          date -u
          echo ""
          echo "IST:"
          TZ=Asia/Kolkata date
          echo "========================================"

      # =====================================================
      # PUBLISH NEWSLETTER TO RENDER
      # =====================================================

      - name: Publish newsletter to Render
        env:
          RENDER_NEWSLETTER_URL: https://ainewsletterdaily-agent.onrender.com/api/publish-newsletter
          NEWSLETTER_PUBLISH_KEY: ${{ secrets.NEWSLETTER_PUBLISH_KEY }}

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests

          print("========================================")
          print("PUBLISH START TIME")
          print("========================================")
          os.system("date -u")
          os.system("TZ=Asia/Kolkata date")
          print("========================================")

          newsletter_file = Path("output/newsletter.json")

          if not newsletter_file.exists():
              raise FileNotFoundError(
                  "output/newsletter.json was not created."
              )

          data = json.loads(
              newsletter_file.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise ValueError(
                  "newsletter.json must contain a JSON object."
              )

          publish_key = os.environ.get(
              "NEWSLETTER_PUBLISH_KEY"
          )

          if not publish_key:
              raise RuntimeError(
                  "NEWSLETTER_PUBLISH_KEY GitHub secret is missing."
              )

          response = requests.post(
              os.environ["RENDER_NEWSLETTER_URL"],
              headers={
                  "Content-Type": "application/json",
                  "X-Newsletter-Key": publish_key,
              },
              json={
                  "data": data
              },
              timeout=60,
          )

          print("Render status:", response.status_code)
          print("Render response:", response.text)

          response.raise_for_status()

          print(
              "Newsletter successfully published to Render."
          )

          print("========================================")
          print("PUBLISH END TIME")
          print("========================================")
          os.system("date -u")
          os.system("TZ=Asia/Kolkata date")
          print("========================================")
          PY