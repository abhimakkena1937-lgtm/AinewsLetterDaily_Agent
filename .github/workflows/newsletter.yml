name: AI Daily Newsletter

on:
  schedule:
    # 10:00 PM IST = 4:30 PM UTC
    - cron: "30 16 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # Install uv
      # =====================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"


      # =====================================================
      # Set up Python
      # =====================================================

      - name: Set up Python
        run: uv python install 3.13


      # =====================================================
      # Install dependencies
      # =====================================================

      - name: Install dependencies
        run: uv sync


      # =====================================================
      # Run AI Daily Newsletter
      # =====================================================

      - name: Run newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}

        run: uv run python daily_runner.py